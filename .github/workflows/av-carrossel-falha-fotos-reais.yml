name: AV - Carrossel falha muscular com fotos reais
on:
  push:
    paths:
      - '.github/workflows/av-carrossel-falha-fotos-reais.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas abertas
        run: python -m pip install Pillow requests numpy
      - name: Renderizar slides com fotos licenciadas
        run: python andre-varela/scripts/build_falha_20261122_fotos_reais.py
      - name: Verificar oito arquivos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('andre-varela/posts/2026-11-22-falha-muscular-reais-v1')
          for i in range(1,9):
              f=p/f'slide-{i:02d}.jpg'
              im=Image.open(f)
              assert im.size==(1080,1350),(f,im.size)
              assert f.stat().st_size<8_000_000,f
              print(f,im.size,f.stat().st_size)
          PY
      - name: Hospedar imagens no GitHub público
        run: |
          git config user.name "AV Editorial Bot"
          git config user.email "av-editorial-bot@users.noreply.github.com"
          git add andre-varela/posts/2026-11-22-falha-muscular-reais-v1/
          if ! git diff --cached --quiet; then
            git commit -m "AV: hospedar 8 slides científicos com fotos reais"
            git push
          fi
